  <g transform="translate(16 16) rotate(-10)">
    <!-- border-radius 50% 50% 50% 12% на квадрате 24×24 -->
    <path
      fill="#b8e35e"
      d="M0-12A12 12 0 0 1 12 0A12 12 0 0 1 0 12H-9.12A2.88 2.88 0 0 1-12 9.12V0A12 12 0 0 1 0-12Z"
    />
    <!-- Unbounded-like bold «l» (path — без внешних шрифтов в favicon) -->
